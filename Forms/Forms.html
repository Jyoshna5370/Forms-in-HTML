<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Course Registration Form</h1>
    <form action="">
        <fieldset>
            <legend><b>Personal Details</b></legend>
        <label for="name"> First Name:</label>
        <input type="text" id="name" name="name"><br><br>

        <label for="name">Sur Name:</label>
        <input type="text" id="name" name="name"><br><br>

        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" name="phone" required><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required><br><br>

        <label for="">Password:</label>
        <input type="password"><br><br>

        <label for="gender">Confirm Password:</label>
        <input type="password"><br><br>

        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" name="dob" required><br><br>
        
        <label for="age">Age:</label>
        <input type="number" id="age" name="age" min="18" max="60"><br><br>

        <label for="gender" >Gender:</label>
        <input type="radio" id="male" name="gender" value="M" required>Male
        <input type="radio" id="female" name="gender" value="F" required>Female
        <input type="radio" id="other" name="gender" value="O" required>Other<br><br>

        <label for="country">Select Country:</label>
        <select id="country" name="country" >
            <option value="india">India</option>
            <option value="usa">USA</option>
            <option value="japan">Japan</option>
            <option value="germany">Germany</option>
            <option value="france">France</option>
            <option value="italy">Italy</option>
        
        </select><br><br>
        
        <label for="upload picture">Upload Picture:</label>
        <input type="file" id="upload picture" name="upload picture" accept="image/*"><br><br><br><br>
        </fieldset> 
        <input type="submit" > <br><br>

        <fieldset> 
            <legend><b>Course Details</b></legend>
        <label for="courses">Select Courses:</label>
        <select id="courses" name="courses" >
            <option value="java_full_stack">Java Full Stack</option>
            <option value="python_full_stack">Python Full Stack</option>
            <option value="data_analytics">Data Analytics</option>
        </select><br><br>

        <label for="delivery">Delivery Mode:</label>
        <input type="radio" id="online" name="delivery" value="online" required>Online
        <input type="radio" id="offline" name="delivery" value="offline" required>Offline<br><br>

         <label for="institute">Institute:</label>
        <input type="text" id="institute" name="institute" required><br><br>

        <label for="comments">Comments:</label><br><br>
        <textarea id="comments" name="comments" rows="4" cols="30"></textarea><br><br>

        <input type="submit" >
        </fieldset>
    </form>
</body>
</html>
